```html
<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heat Transfer Interactive Model</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #ffffff);
        color: #222;
    }

    .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
    }

    .model {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 25px;
    }

    .controls,
    .graph {
        background: white;
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .control {
        margin-bottom: 20px;
    }

    .control-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 7px;
    }

    label {
        font-weight: bold;
    }

    .value {
        font-weight: bold;
    }

    input[type="range"] {
        width: 100%;
        cursor: pointer;
    }

    .equation {
        margin-top: 25px;
        padding: 15px;
        background: #f5f7fa;
        border-radius: 10px;
        text-align: center;
        font-size: 18px;
    }

    canvas {
        width: 100% !important;
        height: 500px !important;
    }

    .temperature {
        text-align: center;
        margin-top: 15px;
        font-size: 20px;
        font-weight: bold;
    }

    @media (max-width: 800px) {
        .model {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>🔥 Heat Transfer Model</h1>

    <p class="subtitle">
        Interactive heat transfer simulation
    </p>

    <div class="model">

        <div class="controls">

            <h2>Parameters</h2>

            <div class="control">
                <div class="control-header">
                    <label>fmin</label>
                    <span class="value" id="fminValue">200 K</span>
                </div>

                <input
                    type="range"
                    id="fmin"
                    min="200"
                    max="500"
                    step="1"
                    value="200"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>fmax</label>
                    <span class="value" id="fmaxValue">1000 K</span>
                </div>

                <input
                    type="range"
                    id="fmax"
                    min="300"
                    max="2000"
                    step="1"
                    value="1000"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>ts</label>
                    <span class="value" id="tsValue">300 s</span>
                </div>

                <input
                    type="range"
                    id="ts"
                    min="0"
                    max="600"
                    step="1"
                    value="300"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>m</label>
                    <span class="value" id="mValue">0.01</span>
                </div>

                <input
                    type="range"
                    id="m"
                    min="0.001"
                    max="0.1"
                    step="0.001"
                    value="0.01"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>k</label>
                    <span class="value" id="kValue">1 W/m·K</span>
                </div>

                <input
                    type="range"
                    id="k"
                    min="0.1"
                    max="10"
                    step="0.1"
                    value="1"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>Tamb</label>
                    <span class="value" id="TambValue">293 K</span>
                </div>

                <input
                    type="range"
                    id="Tamb"
                    min="200"
                    max="500"
                    step="1"
                    value="293"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>h</label>
                    <span class="value" id="hValue">20 W/m²·K</span>
                </div>

                <input
                    type="range"
                    id="h"
                    min="0"
                    max="200"
                    step="1"
                    value="20"
                >
            </div>


            <div class="control">
                <div class="control-header">
                    <label>t</label>
                    <span class="value" id="tValue">300 s</span>
                </div>

                <input
                    type="range"
                    id="t"
                    min="0"
                    max="600"
                    step="1"
                    value="300"
                >
            </div>

        </div>


        <div class="graph">

            <h2>Temperature evolution</h2>

            <canvas id="temperatureChart"></canvas>

            <div class="temperature">
                T(t) = <span id="currentTemperature">---</span> K
            </div>

        </div>

    </div>


    <div class="equation">

        <strong>Heat Transfer Model</strong>

        <br><br>

        dT/dt = k (T<sub>∞</sub> - T) + h (T<sub>amb</sub> - T)

    </div>

</div>


<script>

const elements = [
    "fmin",
    "fmax",
    "ts",
    "m",
    "k",
    "Tamb",
    "h",
    "t"
];


// --------------------------------------------------
// Smooth temperature transition
// --------------------------------------------------

function targetTemperature(time, fmin, fmax, ts, m) {

    if (ts === 0) {
        return fmax;
    }

    return fmin +
        (fmax - fmin) /
        (1 + Math.exp(-(time - ts) * m * 100));

}


// --------------------------------------------------
// Heat transfer model
// --------------------------------------------------

function temperature(time) {

    const fmin = Number(document.getElementById("fmin").value);
    const fmax = Number(document.getElementById("fmax").value);
    const ts   = Number(document.getElementById("ts").value);
    const m    = Number(document.getElementById("m").value);
    const k    = Number(document.getElementById("k").value);
    const Tamb = Number(document.getElementById("Tamb").value);
    const h    = Number(document.getElementById("h").value);

    const dt = 0.5;

    let T = fmin;

    for (let current = 0; current < time; current += dt) {

        const target =
            targetTemperature(
                current,
                fmin,
                fmax,
                ts,
                m
            );

        const dT =
            k * (target - T)
            +
            h / 100 * (Tamb - T);

        T += dT * dt / 100;

    }

    return T;
}


// --------------------------------------------------
// Chart
// --------------------------------------------------

const ctx =
    document.getElementById("temperatureChart");

const chart =
    new Chart(ctx, {

        type: "line",

        data: {

            labels: [],

            datasets: [{

                label: "Temperature (K)",

                data: [],

                tension: 0.25,

                pointRadius: 0

            }]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

                x: {

                    title: {

                        display: true,

                        text: "Time (s)"

                    }

                },

                y: {

                    title: {

                        display: true,

                        text: "Temperature (K)"

                    }

                }

            }

        }

    });


// --------------------------------------------------
// Update model
// --------------------------------------------------

function updateModel() {

    for (const id of elements) {

        const element =
            document.getElementById(id);

        const value =
            document.getElementById(id + "Value");

        if (id === "m") {

            value.textContent =
                Number(element.value).toFixed(3);

        }

        else if (id === "k") {

            value.textContent =
                element.value + " W/m·K";

        }

        else if (id === "h") {

            value.textContent =
                element.value + " W/m²·K";

        }

        else {

            value.textContent =
                element.value +
                (id === "t" || id === "ts"
                    ? " s"
                    : " K");

        }

    }


    const maxTime =
        Number(document.getElementById("t").value);

    const labels = [];

    const data = [];


    for (
        let time = 0;
        time <= maxTime;
        time += 5
    ) {

        labels.push(time);

        data.push(
            temperature(time)
        );

    }


    chart.data.labels = labels;

    chart.data.datasets[0].data = data;

    chart.update();


    document.getElementById(
        "currentTemperature"
    ).textContent =
        temperature(maxTime).toFixed(2);

}


// --------------------------------------------------
// Sliders
// --------------------------------------------------

for (const id of elements) {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            updateModel
        );

}


// Initial calculation

updateModel();

</script>

</body>
</html>
```
